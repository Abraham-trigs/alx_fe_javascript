<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>
  
  <!-- Section where the quote will be displayed -->
  <div id="quoteDisplay"></div>
  
  <!-- Button to generate a new quote -->
  <button id="newQuote">Show New Quote</button>
  
  <!-- Form for adding new quotes -->
  <div>
      <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
      <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
      <button id="addQuoteButton" onclick="addQuote()">Add Quote</button>
  </div>
  
  <!-- Category Filter Dropdown -->
  <div>
      <select id="categoryFilter" onchange="filterQuotes()">
          <option value="all">All Categories</option>
          <!-- Options will be dynamically populated -->
      </select>
  </div>
  
  <!-- (Optional) Export and Import Section can remain if needed -->
  <div>
      <button id="exportQuotes">Export Quotes</button>
      <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)">
  </div>
  
  <!-- Linking the JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
